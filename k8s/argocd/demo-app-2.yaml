apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: demo-app-2
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://github.com/Magrys/platform-lab.git
    targetRevision: HEAD
    path: k8s/apps/demo-app-2

  destination:
    server: https://kubernetes.default.svc
    namespace: demo-app-2

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true